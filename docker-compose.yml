services:
  floci:
    image: floci/floci:1.7.0
    container_name: floci
    ports:
      - "4566:4566"
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_DEFAULT_REGION: us-east-1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_floci/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  floci-data:
